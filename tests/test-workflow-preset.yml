name: Test workflow preset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup CMake and toolchain
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-cmake.sh"
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          workflowPreset: default
      - name: Assert workflow configured, built and tested
        run: |
          B="$GITHUB_WORKSPACE/tests/fixtures/project/build/default"
          if [ ! -f "$B/CMakeCache.txt" ]; then
            echo "FAIL: not configured"
            exit 1
          fi
          if [ ! -x "$B/demo" ]; then
            echo "FAIL: demo not built"
            exit 1
          fi
          if [ ! -f "$B/Testing/Temporary/LastTest.log" ]; then
            echo "FAIL: tests did not run"
            exit 1
          fi
          echo "PASS"
