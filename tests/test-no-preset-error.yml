name: Test error when no preset is provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup CMake and toolchain
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-cmake.sh"
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build"
      - id: action
        uses: .
        continue-on-error: true
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no preset input is given"
            exit 1
          fi
          if [ -d "$GITHUB_WORKSPACE/tests/fixtures/project/build/default" ]; then
            echo "FAIL: nothing should have been configured"
            exit 1
          fi
          echo "PASS"
