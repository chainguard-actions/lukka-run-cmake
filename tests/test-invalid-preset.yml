name: Test invalid configure preset fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install recent CMake and Ninja
        run: |
          set -e
          if ! command -v pip3 >/dev/null 2>&1 && ! python3 -m pip --version >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y python3-pip) || (apt-get update && apt-get install -y python3-pip)
          fi
          python3 -m pip install --user --upgrade cmake ninja \
            || python3 -m pip install --user --break-system-packages --upgrade cmake ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
      - id: action
        uses: .
        continue-on-error: true
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          configurePreset: does-not-exist
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent preset"
            exit 1
          fi
          echo "PASS"
