name: Test configure preset only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup CMake and toolchain
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-cmake.sh"
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          configurePreset: default
      - name: Assert configured but not built
        run: |
          B="$GITHUB_WORKSPACE/tests/fixtures/project/build/default"
          if [ ! -f "$B/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found"
            exit 1
          fi
          if [ ! -f "$B/Makefile" ]; then
            echo "FAIL: Makefile not generated"
            exit 1
          fi
          if [ -e "$B/demo" ]; then
            echo "FAIL: demo should not be built with only configurePreset"
            exit 1
          fi
          echo "PASS"
