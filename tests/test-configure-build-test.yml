name: Test configure, build and test presets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install recent CMake and Ninja
        run: |
          set -e
          if ! command -v pip3 >/dev/null 2>&1 && ! python3 -m pip --version >/dev/null 2>&1; then
            (sudo apt-get update && sudo apt-get install -y python3-pip) || (apt-get update && apt-get install -y python3-pip)
          fi
          python3 -m pip install --user --upgrade cmake ninja \
            || python3 -m pip install --user --break-system-packages --upgrade cmake ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
      - name: Clean build dir
        run: rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build/full"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          configurePreset: full
          buildPreset: full
          testPreset: full
      - name: Assert configure, build and test happened
        run: |
          B="$GITHUB_WORKSPACE/tests/fixtures/project/build/full"
          ls -la "$B" || true
          for f in CMakeCache.txt configured.txt built.txt test-ran.txt; do
            if [ ! -f "$B/$f" ]; then
              echo "FAIL: $B/$f missing"
              exit 1
            fi
          done
          echo "PASS"
