name: Test configure and build presets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup CMake and toolchain
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-cmake.sh"
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          configurePreset: default
          buildPreset: default
      - name: Assert build artifacts exist
        run: |
          B="$GITHUB_WORKSPACE/tests/fixtures/project/build/default"
          ls -la "$B" || true
          if [ ! -f "$B/CMakeCache.txt" ]; then
            echo "FAIL: CMakeCache.txt not found (configure did not run)"
            exit 1
          fi
          if [ ! -x "$B/demo" ]; then
            echo "FAIL: demo executable not built"
            exit 1
          fi
          OUT="$("$B/demo")"
          echo "demo output: $OUT"
          if [ "$OUT" != "hello from demo" ]; then
            echo "FAIL: unexpected demo output"
            exit 1
          fi
          echo "PASS"
