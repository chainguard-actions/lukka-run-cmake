name: Test configurePresetAdditionalArgs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure CMake >= 3.25 and a C toolchain
        run: |
          set -e
          SUDO=""; if [ "$(id -u)" != "0" ] && command -v sudo >/dev/null; then SUDO="sudo"; fi
          if ! command -v cc >/dev/null || ! command -v make >/dev/null; then
            $SUDO apt-get update && $SUDO apt-get install -y build-essential
          fi
          ok=0
          if command -v cmake >/dev/null; then
            ver=$(cmake --version | head -1 | awk '{print $3}')
            if [ "$(printf '%s\n3.25.0\n' "$ver" | sort -V | head -1)" = "3.25.0" ]; then ok=1; fi
          fi
          if [ "$ok" != "1" ]; then
            arch=$(uname -m)
            curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-${arch}.tar.gz" -o /tmp/cmake.tgz
            mkdir -p /tmp/cmake && tar -xzf /tmp/cmake.tgz -C /tmp/cmake --strip-components=1
            echo "/tmp/cmake/bin" >> "$GITHUB_PATH"
            /tmp/cmake/bin/cmake --version
          else
            cmake --version
          fi
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/simple/build"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/simple/CMakeLists.txt
          configurePreset: default
          configurePresetAdditionalArgs: "['-DMY_TEST_VAR=hello123']"
      - name: Assert additional args were passed to configure
        run: |
          B="$GITHUB_WORKSPACE/tests/fixtures/simple/build/default"
          grep MY_TEST_VAR "$B/CMakeCache.txt" || true
          if ! grep -q '^MY_TEST_VAR:.*=hello123$' "$B/CMakeCache.txt"; then
            echo "FAIL: MY_TEST_VAR not found in CMakeCache.txt"
            exit 1
          fi
          ACTUAL=$(cat "$B/my_test_var.txt")
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello123" ]; then
            echo "FAIL: expected hello123"
            exit 1
          fi
          if [ -e "$B/hello" ]; then
            echo "FAIL: build should not have run (no buildPreset)"
            exit 1
          fi
          echo "PASS"
