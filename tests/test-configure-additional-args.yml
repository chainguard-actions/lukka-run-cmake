name: Test configurePresetAdditionalArgs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup CMake and toolchain
        run: |
          bash "$GITHUB_WORKSPACE/tests/fixtures/setup-cmake.sh"
          rm -rf "$GITHUB_WORKSPACE/tests/fixtures/project/build"
      - id: action
        uses: .
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/tests/fixtures/project/CMakeLists.txt
          configurePreset: default
          configurePresetAdditionalArgs: "['-DMY_TEST_VAR=hello_world']"
      - name: Assert additional arg reached the cache
        run: |
          C="$GITHUB_WORKSPACE/tests/fixtures/project/build/default/CMakeCache.txt"
          grep MY_TEST_VAR "$C" || true
          if ! grep -qE '^MY_TEST_VAR(:[A-Z]+)?=hello_world$' "$C"; then
            echo "FAIL: MY_TEST_VAR=hello_world not found in CMakeCache.txt"
            exit 1
          fi
          echo "PASS"
